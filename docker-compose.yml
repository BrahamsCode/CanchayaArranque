# Stack de desarrollo de CanchaYa. Pensado para levantar con `docker compose up`.
services:
  db:
    image: postgres:16
    container_name: canchaya_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-canchaya}
      POSTGRES_USER: ${DB_USERNAME:-canchaya}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-canchaya}
      # Postgres guarda en UTC; fijamos Lima para que las comparaciones de fecha/hora
      # desde psql coincidan con lo que muestra Laravel.
      TZ: America/Lima
      PGTZ: America/Lima
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-canchaya} -d ${DB_DATABASE:-canchaya}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: canchaya_backend
    restart: unless-stopped
    # Espera a que Postgres acepte conexiones antes de migrar.
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_TIMEZONE: America/Lima
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-canchaya}
      DB_USERNAME: ${DB_USERNAME:-canchaya}
      DB_PASSWORD: ${DB_PASSWORD:-canchaya}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    command: ["/usr/local/bin/entrypoint.sh"]

  frontend:
    image: node:20
    container_name: canchaya_frontend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    environment:
      # El proxy de Vite apunta al servicio backend dentro de la red de Compose.
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  db_data:
  backend_vendor:
  frontend_modules:
